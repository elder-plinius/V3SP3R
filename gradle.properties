# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

# Build independent modules concurrently and reuse task outputs via the build cache.
org.gradle.parallel=true
org.gradle.caching=true

# Configuration cache stays off: AGP 9 and Hilt/KSP are not yet reliable with it.
org.gradle.configuration-cache=false

android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# AGP 9.0 compatibility — opt out of breaking DSL changes for now.
# These keep our existing build scripts working without restructuring.
# TODO(AGP 10): migrate to built-in Kotlin and the new DSL, then remove these.
android.builtInKotlin=false
android.newDsl=false

# Install debug builds as regular apps (not test-only), so they persist on device.
android.injected.testOnly=false
